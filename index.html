<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人物關係網</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#f4f1eb;--panel:#fff;--ink:#27231f;--muted:#7c756d;--line:#ddd6cc;--accent:#332e29}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}.hidden{display:none!important}button{cursor:pointer}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);position:relative;z-index:10}.brand{font-weight:800}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.app{height:calc(100vh - 64px);display:grid;grid-template-columns:320px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:15px;overflow:auto}.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.sec:first-child{border-top:0;margin-top:0;padding-top:0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h2{font-size:15px;margin:0}.tiny{font-size:11px;color:var(--muted);line-height:1.5}
.library{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lib{position:relative;border:1px solid var(--line);background:#faf9f7;border-radius:13px;padding:8px 5px;text-align:center}.lib.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(51,46,41,.08)}.lib .avatar{width:54px;height:54px;margin:auto;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:12px;font-weight:800}.lib .avatar img{width:100%;height:100%;object-fit:cover}.lib .lname{font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lib .x{position:absolute;right:4px;top:4px;width:20px;height:20px;border:0;background:rgba(255,255,255,.9);border-radius:50%;font-size:12px;line-height:20px;padding:0;color:#8a7e73}
.current-card{margin-top:9px;padding:10px;border-radius:12px;background:#f7f4ef;border:1px solid var(--line)}.current-name{font-weight:800;font-size:14px}.rel-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}.rel-row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:7px;background:#faf9f7}.rel-ava{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:10px;font-weight:800;border:0;padding:0}.rel-ava img{width:100%;height:100%;object-fit:cover}.rel-title{font-size:11px;font-weight:700}.rel-sub{font-size:10px;color:var(--muted);margin-top:2px}.unlink{border:0;background:transparent;color:#9b8175;font-size:17px;padding:4px}
.stage{position:relative;overflow:hidden;background:var(--bg)}.stage:before{content:"";position:absolute;inset:0;background-image:var(--bgimage,none);background-size:cover;background-position:center;opacity:.28;pointer-events:none}.stage-head{position:absolute;z-index:5;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.stage-head>*{pointer-events:auto}.stage-title{font-size:20px;font-weight:800}.stage-sub{font-size:11px;color:var(--muted);margin-top:3px}.zoom{display:flex;gap:5px}.tool{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff}
#edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.nodes{position:absolute;inset:0;transform-origin:0 0}.node{position:absolute;transform:translate(-50%,-50%);width:130px;text-align:center;cursor:pointer;transition:left .35s ease,top .35s ease}.nava{margin:auto;width:82px;height:82px;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:13px;font-weight:800;border:4px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(0,0,0,.12)}.node.center .nava{width:104px;height:104px}.nava img{width:100%;height:100%;object-fit:cover}.nname{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.86);font-size:12px;font-weight:700;backdrop-filter:blur(5px)}.reltext{font-size:11px;font-weight:700;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted);pointer-events:none}.empty b{font-size:42px}.empty h3{margin:7px 0 2px}.empty p{margin:0;font-size:12px}
dialog{border:0;background:transparent;padding:0}dialog::backdrop{background:rgba(23,20,17,.42);backdrop-filter:blur(3px)}.modal{width:min(580px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mhead h3{margin:0}.mhead p{margin:4px 0 0;font-size:11px;color:var(--muted)}.close{border:0;background:transparent;font-size:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin:10px 0}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}input[type=color]{height:40px;padding:3px}.preview{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#eee;margin:8px auto;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:cover}.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.pick{border:1px solid var(--line);border-radius:12px;background:#faf9f7;padding:8px 5px;text-align:center}.pick.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(51,46,41,.08)}.pick .avatar{width:48px;height:48px;margin:auto;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:10px;font-weight:800}.pick .avatar img{width:100%;height:100%;object-fit:cover}.pick span{display:block;margin-top:4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bg-preset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bg-preset button{border:1px solid var(--line);border-radius:11px;background:#faf9f7;padding:12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);opacity:0;background:#27231f;color:white;padding:9px 13px;border-radius:999px;font-size:12px;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.app{grid-template-columns:1fr;height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}.stage{height:68vh;min-height:520px}.library{grid-template-columns:repeat(5,1fr)}}@media(max-width:560px){.library{grid-template-columns:repeat(3,1fr)}.pick-grid{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.brand small{display:none}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="top"><div class="brand">人物關係網<small>角色建一次，以後直接點頭像使用</small></div><div class="actions"><button id="bgBtn" class="btn">背景</button><button id="saveImageBtn" class="btn primary">儲存圖片</button></div></header>
<main class="app">
<aside class="side">
  <section class="sec"><div class="head"><h2>全部角色</h2><button id="addCharBtn" class="btn" style="padding:6px 9px">＋ 角色</button></div><div class="tiny">點頭像切換中心角色。角色只需要建立一次。</div><div id="library" class="library"></div></section>
  <section class="sec"><div class="head"><h2>目前關係網</h2><button id="addRelationBtn" class="btn" style="padding:6px 9px">＋ 加角色</button></div><div id="currentCard" class="current-card"></div><div id="relationList" class="rel-list"></div></section>
</aside>
<section id="stage" class="stage"><div class="stage-head"><div><div id="stageTitle" class="stage-title">人物關係網</div><div class="stage-sub">點關係網裡的角色，也能直接切換成他的關係網</div></div><div class="zoom"><button id="zoomOut" class="tool">−</button><button id="resetZoom" class="tool">◎</button><button id="zoomIn" class="tool">＋</button></div></div><svg id="edges"></svg><div id="nodes" class="nodes"></div><div id="empty" class="empty hidden"><b>◎</b><h3>這個角色目前沒有關係</h3><p>按左邊「＋ 加角色」從總欄目挑一個。</p></div></section>
</main>

<dialog id="charDlg"><div class="modal"><div class="mhead"><div><h3 id="charDlgTitle">新增角色</h3><p>名字和照片只要輸入這一次。</p></div><button class="close" onclick="charDlg.close()">×</button></div><label>角色名稱<input id="charName"></label><label>角色照片<input id="charPhoto" type="file" accept="image/*"></label><div id="photoPreview" class="preview">預覽</div><label>代表色<input id="charColor" type="color" value="#7d7369"></label><button id="saveCharBtn" class="btn primary" style="width:100%">儲存角色</button></div></dialog>

<dialog id="relationDlg"><div class="modal"><div class="mhead"><div><h3>加入關係角色</h3><p>直接從「全部角色」挑，不用重新輸入名字或照片。</p></div><button class="close" onclick="relationDlg.close()">×</button></div><div id="pickGrid" class="pick-grid"></div><div id="relationFields" class="hidden"><label><span id="fromLabel">目前角色認為對方是……</span><input id="fromRelation" placeholder="例如：摯友"></label><label><span id="toLabel">對方認為目前角色是……</span><input id="toRelation" placeholder="例如：普通朋友"></label><div class="grid2"><label>線條顏色<input id="lineColor" type="color" value="#8a8178"></label><label>線條<select id="lineStyle"><option value="solid">實線</option><option value="dashed">虛線</option><option value="dotted">點線</option></select></label></div><button id="saveRelationBtn" class="btn primary" style="width:100%">加入關係網</button></div></div></dialog>

<dialog id="bgDlg"><div class="modal"><div class="mhead"><div><h3>背景</h3><p>這裡只保留最常用的設定。</p></div><button class="close" onclick="bgDlg.close()">×</button></div><div class="bg-preset"><button data-bg="#f4f1eb">暖白</button><button data-bg="#eef3f7">淡藍</button><button data-bg="#1f1f1d" data-ink="#f2efe9">深色</button></div><label>自訂背景色<input id="bgColor" type="color"></label><label>上傳背景圖片<input id="bgPhoto" type="file" accept="image/*"></label><button id="clearBgPhoto" class="btn" style="width:100%">移除背景圖片</button></div></dialog>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB='character-map-simple-v1', STORE='data';
const S={chars:[],rels:[],focus:null,editChar:null,pick:null,bg:'#f4f1eb',ink:'#27231f',bgImage:null,scale:1,x:0,y:0};
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function persist(){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({chars:S.chars,rels:S.rels,focus:S.focus,bg:S.bg,ink:S.ink,bgImage:S.bgImage},'main');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function load(){let db=await openDB();let data=await new Promise((res,rej)=>{let tx=db.transaction(STORE),r=tx.objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(data)Object.assign(S,data);render()}
function img(c,cls=''){return c.photo?`<img class="${cls}" src="${c.photo}">`:esc(c.name.slice(0,2))}
function current(){return S.chars.find(c=>c.id===S.focus)||null}
function otherRel(r){return r.a===S.focus?r.b:r.a}
function currentLabel(r){return r.a===S.focus?r.aLabel:r.bLabel}
function otherLabel(r){return r.a===S.focus?r.bLabel:r.aLabel}
function links(){return S.rels.filter(r=>r.a===S.focus||r.b===S.focus)}
function render(){if(!S.focus||!S.chars.some(c=>c.id===S.focus))S.focus=S.chars[0]?.id||null;document.documentElement.style.setProperty('--bg',S.bg);document.documentElement.style.setProperty('--ink',S.ink);$('#stage').style.setProperty('--bgimage',S.bgImage?`url("${S.bgImage}")`:'none');$('#bgColor').value=S.bg;renderLibrary();renderRelations();renderGraph()}
function renderLibrary(){let box=$('#library');box.innerHTML=S.chars.length?S.chars.map(c=>`<button class="lib ${c.id===S.focus?'active':''}" data-id="${c.id}"><button class="x" data-del="${c.id}" title="從總欄目刪除">×</button><div class="avatar" style="background:${c.color}">${img(c)}</div><div class="lname">${esc(c.name)}</div></button>`).join(''):'<div class="tiny" style="grid-column:1/-1">還沒有角色，先按「＋ 角色」。</div>';$$('.lib[data-id]').forEach(b=>b.onclick=e=>{if(e.target.dataset.del)return;S.focus=b.dataset.id;persist();render()});$$('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteCharacter(b.dataset.del)})}
function renderRelations(){let c=current();$('#currentCard').innerHTML=c?`<div class="current-name">${esc(c.name)}</div><div class="tiny">下面都是目前出現在 ${esc(c.name)} 關係網裡的人。</div>`:'<div class="tiny">先建立角色。</div>';let rs=links(),box=$('#relationList');box.innerHTML=rs.length?rs.map(r=>{let o=S.chars.find(c=>c.id===otherRel(r));if(!o)return'';return `<div class="rel-row"><button class="rel-ava" data-switch="${o.id}" style="background:${o.color}">${img(o)}</button><div><div class="rel-title">${esc(o.name)} · ${esc(currentLabel(r)||'未命名')}</div><div class="rel-sub">對方看你：${esc(otherLabel(r)||'未設定')}</div></div><button class="unlink" data-unlink="${r.id}" title="從這個關係網移除">×</button></div>`}).join(''):'<div class="tiny">目前沒有加入任何人。</div>';$$('[data-switch]').forEach(b=>b.onclick=()=>{S.focus=b.dataset.switch;persist();render()});$$('[data-unlink]').forEach(b=>b.onclick=()=>unlink(b.dataset.unlink))}
function renderGraph(){let nodes=$('#nodes'),svg=$('#edges'),emp=$('#empty');if(!S.chars.length){nodes.innerHTML='';svg.innerHTML='';emp.classList.remove('hidden');return}let c=current(),rs=links(),ids=[];rs.forEach(r=>{let x=otherRel(r);if(!ids.includes(x))ids.push(x)});emp.classList.toggle('hidden',ids.length>0);let rc=$('#stage').getBoundingClientRect(),cx=rc.width/2,cy=rc.height/2+28,rx=Math.min(rc.width*.34,360),ry=Math.min(rc.height*.30,250),pos={[c.id]:{x:cx,y:cy}};ids.forEach((x,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);pos[x]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});nodes.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.scale})`;svg.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.scale})`;svg.style.transformOrigin='0 0';nodes.innerHTML=[c.id,...ids].map(x=>{let p=pos[x],ch=S.chars.find(v=>v.id===x);return `<div class="node ${x===c.id?'center':''}" data-node="${x}" style="left:${p.x}px;top:${p.y}px"><div class="nava" style="background:${ch.color}">${img(ch)}</div><span class="nname">${esc(ch.name)}</span></div>`}).join('');$$('[data-node]').forEach(n=>n.onclick=()=>{if(n.dataset.node!==S.focus){S.focus=n.dataset.node;persist();render()}});let out='';rs.forEach(r=>{let a=pos[c.id],b=pos[otherRel(r)],dash=r.style==='dashed'?'10 8':r.style==='dotted'?'2 7':'';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${r.color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${dash}"/>`;let lab=currentLabel(r);if(lab)out+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-8}" text-anchor="middle" class="reltext" fill="${S.ink}" stroke="${S.bg}">${esc(lab)}</text>`});svg.innerHTML=out}
function fileData(file,size=420,quality=.82){return new Promise((res,rej)=>{let fr=new FileReader();fr.onerror=rej;fr.onload=()=>{let im=new Image();im.onerror=rej;im.onload=()=>{let n=Math.min(im.width,im.height),sx=(im.width-n)/2,sy=(im.height-n)/2,c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,sx,sy,n,n,0,0,size,size);res(c.toDataURL('image/jpeg',quality))};im.src=fr.result};fr.readAsDataURL(file)})}
function openChar(idv=null){S.editChar=idv;let c=S.chars.find(x=>x.id===idv);$('#charDlgTitle').textContent=c?'編輯角色':'新增角色';$('#charName').value=c?.name||'';$('#charColor').value=c?.color||'#7d7369';$('#charPhoto').value='';$('#photoPreview').innerHTML=c?.photo?`<img src="${c.photo}">`:'預覽';charDlg.showModal()}
async function saveChar(){let name=$('#charName').value.trim();if(!name)return toast('請輸入角色名稱');let old=S.chars.find(c=>c.id===S.editChar),photo=old?.photo||null,file=$('#charPhoto').files[0];if(file)photo=await fileData(file);let c={id:old?.id||id(),name,color:$('#charColor').value,photo};if(old)Object.assign(old,c);else S.chars.push(c);if(!S.focus)S.focus=c.id;await persist();charDlg.close();render();toast('角色已儲存')}
async function deleteCharacter(cid){let c=S.chars.find(x=>x.id===cid);if(!c||!confirm(`確定把「${c.name}」從全部角色刪除？和他的關係也會一起刪除。`))return;S.chars=S.chars.filter(x=>x.id!==cid);S.rels=S.rels.filter(r=>r.a!==cid&&r.b!==cid);if(S.focus===cid)S.focus=S.chars[0]?.id||null;await persist();render()}
function openRelation(){if(!S.focus)return toast('先建立角色');let existing=new Set(links().map(otherRel));let candidates=S.chars.filter(c=>c.id!==S.focus&&!existing.has(c.id));$('#pickGrid').innerHTML=candidates.length?candidates.map(c=>`<button class="pick" data-pick="${c.id}"><div class="avatar" style="background:${c.color}">${img(c)}</div><span>${esc(c.name)}</span></button>`).join(''):'<div class="tiny" style="grid-column:1/-1">全部角色都已經在這個關係網裡了。</div>';S.pick=null;$('#relationFields').classList.add('hidden');relationDlg.showModal();$$('[data-pick]').forEach(b=>b.onclick=()=>{S.pick=b.dataset.pick;$$('[data-pick]').forEach(x=>x.classList.toggle('sel',x.dataset.pick===S.pick));let me=current(),o=S.chars.find(c=>c.id===S.pick);$('#fromLabel').textContent=`${me.name} 認為 ${o.name} 是……`;$('#toLabel').textContent=`${o.name} 認為 ${me.name} 是……`;$('#fromRelation').value='';$('#toRelation').value='';$('#relationFields').classList.remove('hidden')})}
async function saveRelation(){if(!S.pick)return;S.rels.push({id:id(),a:S.focus,b:S.pick,aLabel:$('#fromRelation').value.trim(),bLabel:$('#toRelation').value.trim(),color:$('#lineColor').value,style:$('#lineStyle').value});await persist();relationDlg.close();render();toast('已加入關係網')}
async function unlink(rid){S.rels=S.rels.filter(r=>r.id!==rid);await persist();render();toast('已從關係網移除')}
async function saveImage(){let oldx=S.x,oldy=S.y,olds=S.scale;S.x=S.y=0;S.scale=1;renderGraph();await new Promise(r=>setTimeout(r,80));let canvas=await html2canvas($('#stage'),{backgroundColor:S.bg,scale:2,useCORS:true});let a=document.createElement('a');a.download=(current()?.name||'人物')+'-關係網.png';a.href=canvas.toDataURL('image/png');a.click();S.x=oldx;S.y=oldy;S.scale=olds;renderGraph();toast('圖片已儲存')}
$('#addCharBtn').onclick=()=>openChar();$('#saveCharBtn').onclick=saveChar;$('#charPhoto').onchange=async e=>{let f=e.target.files[0];if(f)$('#photoPreview').innerHTML=`<img src="${await fileData(f,220,.8)}">`};$('#addRelationBtn').onclick=openRelation;$('#saveRelationBtn').onclick=saveRelation;$('#saveImageBtn').onclick=saveImage;$('#bgBtn').onclick=()=>bgDlg.showModal();$$('[data-bg]').forEach(b=>b.onclick=async()=>{S.bg=b.dataset.bg;S.ink=b.dataset.ink||'#27231f';await persist();render()});$('#bgColor').oninput=e=>{S.bg=e.target.value;persist();render()};$('#bgPhoto').onchange=async e=>{let f=e.target.files[0];if(f){S.bgImage=await fileData(f,1400,.78);await persist();render()}};$('#clearBgPhoto').onclick=async()=>{S.bgImage=null;await persist();render()};function zoom(d){S.scale=Math.max(.55,Math.min(1.8,S.scale+d));renderGraph()}$('#zoomIn').onclick=()=>zoom(.1);$('#zoomOut').onclick=()=>zoom(-.1);$('#resetZoom').onclick=()=>{S.scale=1;S.x=S.y=0;renderGraph()};let drag=false,sx,sy,ox,oy;$('#stage').onpointerdown=e=>{if(e.target.closest('.node')||e.target.closest('.zoom'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=S.x;oy=S.y;$('#stage').setPointerCapture(e.pointerId)};$('#stage').onpointermove=e=>{if(!drag)return;S.x=ox+e.clientX-sx;S.y=oy+e.clientY-sy;renderGraph()};$('#stage').onpointerup=()=>drag=false;$('#stage').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.08:-.08)},{passive:false});window.onresize=renderGraph;load();
</script>
