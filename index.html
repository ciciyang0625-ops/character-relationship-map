<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物關係網</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
:root{--bg:#f4f1eb;--ink:#27231f;--panel:#fff;--line:#ddd6cc;--muted:#7c756d;--accent:#332e29}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fffffff0;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:800}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.app{height:calc(100vh - 64px);display:grid;grid-template-columns:320px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:15px;overflow:auto}.sec+.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h2{font-size:15px;margin:0}.tiny{font-size:11px;color:var(--muted);line-height:1.5}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lib{position:relative;border:1px solid var(--line);background:#faf9f7;border-radius:13px;padding:8px 5px;text-align:center;cursor:pointer}.lib.active{border-color:var(--accent);box-shadow:0 0 0 2px #332e2912}.lib .avatar,.pick .avatar{width:54px;height:54px;margin:auto;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:11px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.lname{font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{position:absolute;right:4px;top:4px;width:20px;height:20px;border:0;background:#fffffff0;border-radius:50%;padding:0;color:#967f73}.current{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#f8f6f2}.current b{font-size:14px}.rel-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}.rel{display:grid;grid-template-columns:38px 1fr auto auto;gap:7px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:7px;background:#faf9f7}.relava{width:38px;height:38px;border:0;border-radius:50%;overflow:hidden;padding:0;background:#ddd;display:grid;place-items:center;font-size:9px;font-weight:800;cursor:pointer}.relava img{width:100%;height:100%;object-fit:cover}.rtitle{font-size:11px;font-weight:700}.rsub{font-size:10px;color:var(--muted)}.iconbtn{border:0;background:transparent;padding:4px;color:#8f796f;cursor:pointer}.stage{position:relative;overflow:hidden;background:var(--bg)}.stage:before{content:"";position:absolute;inset:0;background-image:var(--bgimage,none);background-size:cover;background-position:center;opacity:.28;pointer-events:none}.stagehead{position:absolute;z-index:4;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;pointer-events:none}.stagehead>*{pointer-events:auto}.title{font-weight:800;font-size:20px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:5px}.tool{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.nodes{position:absolute;inset:0;transform-origin:0 0}.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:130px;cursor:pointer;transition:left .35s ease,top .35s ease}.nava{width:82px;height:82px;margin:auto;border-radius:50%;overflow:hidden;background:#ddd;border:4px solid #fffffff2;box-shadow:0 8px 24px #0002;display:grid;place-items:center;font-size:12px;font-weight:800}.node.center .nava{width:104px;height:104px}.nava img{width:100%;height:100%;object-fit:cover}.nname{display:inline-block;margin-top:6px;background:#ffffffdc;border-radius:7px;padding:3px 7px;font-size:12px;font-weight:700}.reltext{font-size:11px;font-weight:700;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted);pointer-events:none}.empty b{font-size:42px}.empty h3{margin:7px 0 2px}.empty p{margin:0;font-size:12px}dialog{border:0;background:transparent;padding:0}dialog::backdrop{background:#17141166;backdrop-filter:blur(3px)}.modal{width:min(580px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.mhead{display:flex;justify-content:space-between}.mhead h3{margin:0}.mhead p{font-size:11px;color:var(--muted);margin:4px 0}.close{border:0;background:transparent;font-size:22px;cursor:pointer}label{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:12px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}input[type=color]{height:40px;padding:3px}.preview{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#eee;margin:8px auto;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:cover}.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.pick{border:1px solid var(--line);border-radius:12px;background:#faf9f7;padding:8px 5px;text-align:center;cursor:pointer}.pick.sel{border-color:var(--accent);box-shadow:0 0 0 2px #332e2912}.pick span{display:block;margin-top:4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid2,.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.presets{grid-template-columns:repeat(3,1fr)}.presets button{border:1px solid var(--line);border-radius:10px;background:#faf9f7;padding:11px;cursor:pointer}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);opacity:0;background:#27231f;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:850px){.app{grid-template-columns:1fr;height:auto}.stage{height:68vh;min-height:520px}.side{border-right:0;border-bottom:1px solid var(--line)}.library{grid-template-columns:repeat(5,1fr)}}@media(max-width:560px){.library{grid-template-columns:repeat(3,1fr)}.pickgrid{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.brand small{display:none}}
</style></head><body><div id="toast" class="toast"></div><header class="top"><div class="brand">人物關係網<small>角色只建立一次，之後都直接點頭像</small></div><div class="actions"><button id="bgBtn" class="btn">背景</button><button id="saveImage" class="btn primary">儲存圖片</button></div></header><main class="app"><aside class="side"><section class="sec"><div class="head"><h2>全部角色</h2><button id="addChar" class="btn" style="padding:6px 9px">＋角色</button></div><div class="tiny">所有角色都會留在這裡。點角色切換成他的關係網。</div><div id="library" class="library"></div></section><section class="sec"><div class="head"><h2>目前關係網</h2><button id="addRel" class="btn" style="padding:6px 9px">＋加角色</button></div><div id="current" class="current"></div><div id="rels" class="rel-list"></div></section></aside><section id="stage" class="stage"><div class="stagehead"><div><div class="title">人物關係網</div><div class="sub">點任何頭像都可以切換角色視角</div></div><div class="tools"><button id="zout" class="tool">−</button><button id="reset" class="tool">◎</button><button id="zin" class="tool">＋</button></div></div><svg id="edges"></svg><div id="nodes" class="nodes"></div><div id="empty" class="empty hidden"><b>◎</b><h3>這個角色還沒有關係</h3><p>按左邊「＋加角色」從總欄目挑一個。</p></div></section></main>
<dialog id="charDlg"><div class="modal"><div class="mhead"><div><h3 id="charTitle">新增角色</h3><p>名字與照片只要輸入這一次。</p></div><button class="close" onclick="charDlg.close()">×</button></div><label>角色名稱<input id="charName"></label><label>角色照片<input id="charPhoto" type="file" accept="image/*"></label><div id="preview" class="preview">預覽</div><label>代表色<input id="charColor" type="color" value="#7d7369"></label><button id="saveChar" class="btn primary" style="width:100%">儲存角色</button></div></dialog>
<dialog id="relDlg"><div class="modal"><div class="mhead"><div><h3 id="relTitle">加入關係角色</h3><p>直接點現有角色的頭像。</p></div><button class="close" onclick="relDlg.close()">×</button></div><div id="pickgrid" class="pickgrid"></div><div id="relfields" class="hidden"><label><span id="fromText"></span><input id="fromRel" placeholder="例如：摯友"></label><label><span id="toText"></span><input id="toRel" placeholder="例如：普通朋友"></label><div class="grid2"><label>線條顏色<input id="lineColor" type="color" value="#8a8178"></label><label>線條<select id="lineStyle"><option value="solid">實線</option><option value="dashed">虛線</option><option value="dotted">點線</option></select></label></div><button id="saveRel" class="btn primary" style="width:100%">儲存關係</button></div></div></dialog>
<dialog id="bgDlg"><div class="modal"><div class="mhead"><div><h3>背景</h3><p>只留最簡單的幾個選項。</p></div><button class="close" onclick="bgDlg.close()">×</button></div><div class="presets"><button data-bg="#f4f1eb" data-ink="#27231f">暖白</button><button data-bg="#eef3f7" data-ink="#203040">淡藍</button><button data-bg="#1f1f1d" data-ink="#f2efe9">深色</button></div><label>背景色<input id="bgColor" type="color"></label><label>上傳背景圖片<input id="bgPhoto" type="file" accept="image/*"></label><button id="clearBg" class="btn" style="width:100%">移除背景圖片</button></div></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],S={chars:[],rels:[],focus:null,editChar:null,editRel:null,pick:null,bg:'#f4f1eb',ink:'#27231f',bgImage:null,scale:1,x:0,y:0};const DB='character-map-simple-v2';function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1700)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function db(){return new Promise((a,b)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function save(){let d=await db();return new Promise((a,b)=>{let t=d.transaction('s','readwrite');t.objectStore('s').put({chars:S.chars,rels:S.rels,focus:S.focus,bg:S.bg,ink:S.ink,bgImage:S.bgImage},'main');t.oncomplete=a;t.onerror=()=>b(t.error)})}async function load(){let d=await db(),v=await new Promise((a,b)=>{let t=d.transaction('s'),r=t.objectStore('s').get('main');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});if(v)Object.assign(S,v);render()}function photo(c){return c.photo?`<img src="${c.photo}">`:esc(c.name.slice(0,2))}function cur(){return S.chars.find(c=>c.id===S.focus)}function other(r){return r.a===S.focus?r.b:r.a}function label(r){return r.a===S.focus?r.aLabel:r.bLabel}function backLabel(r){return r.a===S.focus?r.bLabel:r.aLabel}function links(){return S.rels.filter(r=>r.a===S.focus||r.b===S.focus)}function render(){if(!S.focus||!S.chars.some(c=>c.id===S.focus))S.focus=S.chars[0]?.id||null;document.documentElement.style.setProperty('--bg',S.bg);document.documentElement.style.setProperty('--ink',S.ink);$('#stage').style.setProperty('--bgimage',S.bgImage?`url("${S.bgImage}")`:'none');$('#bgColor').value=S.bg;library();relations();graph()}function library(){let b=$('#library');b.innerHTML=S.chars.length?S.chars.map(c=>`<div class="lib ${c.id===S.focus?'active':''}" data-id="${c.id}"><button class="del" data-del="${c.id}" title="從總欄目刪除">×</button><div class="avatar" style="background:${c.color}">${photo(c)}</div><div class="lname">${esc(c.name)}</div></div>`).join(''):'<div class="tiny" style="grid-column:1/-1">還沒有角色，先按「＋角色」。</div>';$$('.lib[data-id]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-del]'))return;S.focus=x.dataset.id;save();render()});$$('[data-del]').forEach(x=>x.onclick=e=>{e.stopPropagation();delCharacter(x.dataset.del)})}function relations(){let c=cur();$('#current').innerHTML=c?`<b>${esc(c.name)}</b><div class="tiny">下方角色就是目前在這張關係網裡的人。</div>`:'<div class="tiny">先建立角色。</div>';let rs=links();$('#rels').innerHTML=rs.length?rs.map(r=>{let o=S.chars.find(c=>c.id===other(r));return o?`<div class="rel"><button class="relava" data-switch="${o.id}" style="background:${o.color}">${photo(o)}</button><div><div class="rtitle">${esc(o.name)} · ${esc(label(r)||'未命名')}</div><div class="rsub">對方看你：${esc(backLabel(r)||'未設定')}</div></div><button class="iconbtn" data-editrel="${r.id}" title="編輯">✎</button><button class="iconbtn" data-unlink="${r.id}" title="從關係網移除">×</button></div>`:''}).join(''):'<div class="tiny">目前沒有加入任何人。</div>';$$('[data-switch]').forEach(x=>x.onclick=()=>{S.focus=x.dataset.switch;save();render()});$$('[data-unlink]').forEach(x=>x.onclick=()=>unlink(x.dataset.unlink));$$('[data-editrel]').forEach(x=>x.onclick=()=>openRel(x.dataset.editrel))}function graph(){let n=$('#nodes'),svg=$('#edges'),e=$('#empty');if(!S.chars.length){n.innerHTML='';svg.innerHTML='';e.classList.remove('hidden');return}let c=cur(),rs=links(),ids=[];rs.forEach(r=>{let i=other(r);if(!ids.includes(i))ids.push(i)});e.classList.toggle('hidden',ids.length>0);let rc=$('#stage').getBoundingClientRect(),cx=rc.width/2,cy=rc.height/2+28,rx=Math.min(rc.width*.34,360),ry=Math.min(rc.height*.3,250),p={[c.id]:{x:cx,y:cy}};ids.forEach((id,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);p[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});n.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.scale})`;svg.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.scale})`;svg.style.transformOrigin='0 0';n.innerHTML=[c.id,...ids].map(id=>{let q=p[id],ch=S.chars.find(v=>v.id===id);return `<div class="node ${id===c.id?'center':''}" data-node="${id}" style="left:${q.x}px;top:${q.y}px"><div class="nava" style="background:${ch.color}">${photo(ch)}</div><span class="nname">${esc(ch.name)}</span></div>`}).join('');$$('[data-node]').forEach(x=>x.onclick=()=>{if(x.dataset.node!==S.focus){S.focus=x.dataset.node;save();render()}});let out='';rs.forEach(r=>{let a=p[c.id],b=p[other(r)],dash=r.style==='dashed'?'10 8':r.style==='dotted'?'2 7':'';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${r.color}" stroke-width="3" stroke-dasharray="${dash}" stroke-linecap="round"/>`;let t=label(r);if(t)out+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-8}" text-anchor="middle" class="reltext" fill="${S.ink}" stroke="${S.bg}">${esc(t)}</text>`});svg.innerHTML=out}function imageData(file,size=420,q=.82){return new Promise((a,b)=>{let fr=new FileReader;fr.onerror=b;fr.onload=()=>{let im=new Image;im.onerror=b;im.onload=()=>{let m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2,c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,size,size);a(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}function openChar(id=null){S.editChar=id;let c=S.chars.find(x=>x.id===id);$('#charTitle').textContent=c?'編輯角色':'新增角色';$('#charName').value=c?.name||'';$('#charColor').value=c?.color||'#7d7369';$('#charPhoto').value='';$('#preview').innerHTML=c?.photo?`<img src="${c.photo}">`:'預覽';charDlg.showModal()}async function saveChar(){let name=$('#charName').value.trim();if(!name)return toast('請輸入角色名稱');let old=S.chars.find(c=>c.id===S.editChar),ph=old?.photo||null,f=$('#charPhoto').files[0];if(f)ph=await imageData(f);let c={id:old?.id||uid(),name,color:$('#charColor').value,photo:ph};old?Object.assign(old,c):S.chars.push(c);if(!S.focus)S.focus=c.id;await save();charDlg.close();render();toast('角色已儲存')}async function delCharacter(id){let c=S.chars.find(x=>x.id===id);if(!c||!confirm(`確定把「${c.name}」從全部角色刪除？`))return;S.chars=S.chars.filter(x=>x.id!==id);S.rels=S.rels.filter(r=>r.a!==id&&r.b!==id);if(S.focus===id)S.focus=S.chars[0]?.id||null;await save();render()}function openRel(rid=null){if(!S.focus)return toast('先建立角色');S.editRel=rid;let r=S.rels.find(x=>x.id===rid),used=new Set(links().map(other));let choices=S.chars.filter(c=>c.id!==S.focus&&(!used.has(c.id)||c.id===other(r||{})));$('#pickgrid').innerHTML=choices.length?choices.map(c=>`<button class="pick ${r&&c.id===other(r)?'sel':''}" data-pick="${c.id}"><div class="avatar" style="background:${c.color}">${photo(c)}</div><span>${esc(c.name)}</span></button>`).join(''):'<div class="tiny" style="grid-column:1/-1">全部角色都已加入。</div>';S.pick=r?other(r):null;$('#relfields').classList.toggle('hidden',!S.pick);if(r)fillRelFields(r);relDlg.showModal();$$('[data-pick]').forEach(x=>x.onclick=()=>{S.pick=x.dataset.pick;$$('[data-pick]').forEach(y=>y.classList.toggle('sel',y.dataset.pick===S.pick));fillRelFields(r)})}function fillRelFields(r){let me=cur(),o=S.chars.find(c=>c.id===S.pick);$('#fromText').textContent=`${me.name} 認為 ${o.name} 是……`;$('#toText').textContent=`${o.name} 認為 ${me.name} 是……`;if(r){$('#fromRel').value=label(r);$('#toRel').value=backLabel(r);$('#lineColor').value=r.color;$('#lineStyle').value=r.style}else{$('#fromRel').value='';$('#toRel').value='';$('#lineColor').value='#8a8178';$('#lineStyle').value='solid'}$('#relfields').classList.remove('hidden')}async function saveRel(){if(!S.pick)return;let r=S.rels.find(x=>x.id===S.editRel);if(r){let me=S.focus;if(r.a===me){r.b=S.pick;r.aLabel=$('#fromRel').value.trim();r.bLabel=$('#toRel').value.trim()}else{r.a=S.pick;r.b=me;r.aLabel=$('#toRel').value.trim();r.bLabel=$('#fromRel').value.trim()}r.color=$('#lineColor').value;r.style=$('#lineStyle').value}else S.rels.push({id:uid(),a:S.focus,b:S.pick,aLabel:$('#fromRel').value.trim(),bLabel:$('#toRel').value.trim(),color:$('#lineColor').value,style:$('#lineStyle').value});await save();relDlg.close();render();toast('關係已儲存')}async function unlink(id){S.rels=S.rels.filter(r=>r.id!==id);await save();render();toast('已從關係網移除')}async function exportImage(){let ox=S.x,oy=S.y,os=S.scale;S.x=S.y=0;S.scale=1;graph();await new Promise(r=>setTimeout(r,80));let c=await html2canvas($('#stage'),{backgroundColor:S.bg,scale:2,useCORS:true});let a=document.createElement('a');a.download=(cur()?.name||'人物')+'-關係網.png';a.href=c.toDataURL('image/png');a.click();S.x=ox;S.y=oy;S.scale=os;graph();toast('圖片已儲存')}$('#addChar').onclick=()=>openChar();$('#saveChar').onclick=saveChar;$('#charPhoto').onchange=async e=>{let f=e.target.files[0];if(f)$('#preview').innerHTML=`<img src="${await imageData(f,220,.8)}">`};$('#addRel').onclick=()=>openRel();$('#saveRel').onclick=saveRel;$('#saveImage').onclick=exportImage;$('#bgBtn').onclick=()=>bgDlg.showModal();$$('[data-bg]').forEach(x=>x.onclick=async()=>{S.bg=x.dataset.bg;S.ink=x.dataset.ink;await save();render()});$('#bgColor').oninput=e=>{S.bg=e.target.value;save();render()};$('#bgPhoto').onchange=async e=>{let f=e.target.files[0];if(f){S.bgImage=await imageData(f,1400,.78);await save();render()}};$('#clearBg').onclick=async()=>{S.bgImage=null;await save();render()};function zoom(d){S.scale=Math.max(.55,Math.min(1.8,S.scale+d));graph()}$('#zin').onclick=()=>zoom(.1);$('#zout').onclick=()=>zoom(-.1);$('#reset').onclick=()=>{S.scale=1;S.x=S.y=0;graph()};let drag=false,sx,sy,ox,oy;$('#stage').onpointerdown=e=>{if(e.target.closest('.node')||e.target.closest('.tools'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=S.x;oy=S.y;$('#stage').setPointerCapture(e.pointerId)};$('#stage').onpointermove=e=>{if(!drag)return;S.x=ox+e.clientX-sx;S.y=oy+e.clientY-sy;graph()};$('#stage').onpointerup=()=>drag=false;$('#stage').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.08:-.08)},{passive:false});window.onresize=graph;load();
</script></body></html>
