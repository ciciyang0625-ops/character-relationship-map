<style>
:root{--bg:#f4f1eb;--ink:#27231f;--card:#fff;--soft:#f8f6f2;--line:#ded8cf;--muted:#80786f;--accent:#332e29;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit;color:inherit}.hidden{display:none!important}button{touch-action:manipulation}.app{min-height:100dvh;padding-bottom:calc(76px + var(--safe))}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}.brand{font-size:16px;font-weight:850;letter-spacing:.02em}.top-actions{display:flex;gap:7px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:13px;background:var(--card);display:grid;place-items:center;font-size:17px;box-shadow:0 3px 10px #00000008}.main{max-width:760px;margin:auto}.stage-wrap{padding:10px 10px 0}.stage{position:relative;height:min(44dvh,440px);min-height:300px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--bg);box-shadow:0 10px 35px #241d160d;isolation:isolate}.stage:before{content:"";position:absolute;inset:0;background-image:var(--bgimg,none);background-size:cover;background-position:center;opacity:.25;z-index:-2}.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,transparent 10%,color-mix(in srgb,var(--bg) 58%,transparent) 88%);z-index:-1;pointer-events:none}.stage-head{position:absolute;left:14px;right:14px;top:13px;z-index:8;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.stage-head>*{pointer-events:auto}.stage-title{font-size:17px;font-weight:850}.stage-sub{font-size:10px;color:var(--muted);margin-top:2px}.tools{display:flex;gap:5px}.tool{width:34px;height:34px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);border-radius:11px;display:grid;place-items:center}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.nodes{position:absolute;inset:0;transform-origin:0 0}.node{position:absolute;width:92px;text-align:center;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;transition:left .52s cubic-bezier(.2,1.35,.35,1),top .52s cubic-bezier(.2,1.35,.35,1),transform .18s ease}.node:active{transform:translate(-50%,-50%) scale(.9)}.node.dragging{cursor:grabbing;transition:none!important;z-index:12;transform:translate(-50%,-50%) scale(1.05)}.node.dragging .nava{box-shadow:0 12px 30px #1f1b1745}.node.squish{animation:node-squish .35s cubic-bezier(.2,1.45,.3,1)}@keyframes node-squish{0%{transform:translate(-50%,-50%) scale(.91,1.08)}60%{transform:translate(-50%,-50%) scale(1.06,.96)}100%{transform:translate(-50%,-50%) scale(1)}}.nava{width:64px;height:64px;margin:auto;border-radius:50%;overflow:hidden;background:#ddd;border:3px solid #ffffffee;box-shadow:0 8px 24px #1f1b1730;display:grid;place-items:center;font-size:10px;font-weight:800;transition:width .4s cubic-bezier(.2,1.4,.3,1),height .4s cubic-bezier(.2,1.4,.3,1)}.node.center .nava{width:86px;height:86px}.nava img{width:100%;height:100%;object-fit:cover}.nname{display:inline-block;max-width:92px;margin-top:5px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px #0000000b}.node.center .nname{font-size:11px}.reltext{font-size:10px;font-weight:800;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;color:var(--muted);pointer-events:none}.empty b{font-size:34px}.empty h3{font-size:14px;margin:7px 0 3px}.empty p{font-size:11px;margin:0}.jelly .node{animation:jelly-node .55s cubic-bezier(.2,1.3,.3,1)}.jelly .stage-title{animation:jelly-title .45s ease}.jelly .reltext{animation:fade-label .45s ease}@keyframes jelly-node{0%{filter:blur(.2px);opacity:.25;transform:translate(-50%,-50%) scale(.72,.9)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.09,.94)}75%{transform:translate(-50%,-50%) scale(.97,1.04)}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes jelly-title{0%{transform:translateY(-4px);opacity:.2}70%{transform:translateY(2px)}100%{transform:none;opacity:1}}@keyframes fade-label{from{opacity:0}to{opacity:1}}.panel{padding:12px 12px 22px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.panel-title h2{font-size:14px;margin:0}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.quick-actions .primary,.quick-actions .ghost{min-height:44px;font-size:11px}.index-search{margin:0 0 10px!important}.stage.exporting .tools{display:none!important}.stage.exporting .stage-sub{display:none!important}.small{font-size:10px;color:var(--muted);line-height:1.45}.primary,.ghost{border-radius:13px;padding:9px 12px;font-weight:750}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.ghost{border:1px solid var(--line);background:var(--card)}.current-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:16px;box-shadow:0 6px 18px #00000008}.current-card .miniava{width:42px;height:42px}.current-name{font-size:13px;font-weight:850}.current-info{font-size:10px;color:var(--muted);margin-top:2px}.rel-list{display:flex;flex-direction:column;gap:8px;margin-top:9px}.rel-row{display:grid;grid-template-columns:42px 1fr auto auto;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:15px;background:var(--card);animation:row-in .35s cubic-bezier(.2,1.2,.3,1)}@keyframes row-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.relava,.miniava{border:0;border-radius:50%;overflow:hidden;background:#ddd;display:grid;place-items:center;font-size:9px;font-weight:800;padding:0}.relava{width:42px;height:42px}.relava img,.miniava img{width:100%;height:100%;object-fit:cover}.rname{font-size:12px;font-weight:800}.rdesc{font-size:10px;color:var(--muted);margin-top:2px}.mini-act{width:30px;height:30px;border:0;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}.character-list{display:flex;flex-direction:column;gap:7px}.char-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;min-height:58px;padding:8px 9px;border:1px solid var(--line);border-radius:15px;background:var(--card);transition:transform .18s ease,border-color .18s ease}.char-row:active{transform:scale(.975)}.char-row.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 8%,transparent)}.char-row .miniava{width:42px;height:42px}.char-name{font-size:12px;font-weight:850}.char-hint{font-size:9px;color:var(--muted);margin-top:2px}.delete{width:30px;height:30px;border:0;background:transparent;border-radius:10px;color:#9b786e}.bottom-nav{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safe));height:58px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border:1px solid color-mix(in srgb,var(--line) 85%,transparent);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 10px 30px #1d171326}.navbtn{border:0;background:transparent;border-radius:15px;font-size:11px;color:var(--muted);font-weight:750}.navbtn.active{background:var(--accent);color:#fff;animation:nav-jelly .35s cubic-bezier(.2,1.45,.3,1)}@keyframes nav-jelly{0%{transform:scale(.88)}65%{transform:scale(1.06)}100%{transform:scale(1)}}.view{display:none}.view.active{display:block;animation:view-in .3s ease}@keyframes view-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}dialog{border:0;background:transparent;padding:0;margin:auto 0 0;width:100%;max-width:none}dialog::backdrop{background:#17141173;backdrop-filter:blur(4px)}.sheet{width:100%;max-height:88dvh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + var(--safe));box-shadow:0 -16px 45px #0002;animation:sheet-in .42s cubic-bezier(.2,1.25,.3,1)}@keyframes sheet-in{0%{transform:translateY(100%)}65%{transform:translateY(-2%)}100%{transform:none}}.grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 12px}.mhead{display:flex;justify-content:space-between;align-items:flex-start}.mhead h3{font-size:17px;margin:0}.mhead p{font-size:10px;color:var(--muted);margin:4px 0 0}.close{width:34px;height:34px;border:0;border-radius:11px;background:var(--soft);font-size:19px}label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);margin:12px 0}input,select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 12px;outline:none}input:focus,select:focus{border-color:#aaa096;box-shadow:0 0 0 3px #aaa09618}input[type=color]{height:44px;padding:4px}.crop-area{height:300px;margin:10px 0;border-radius:18px;overflow:hidden;background:#eee;position:relative}.crop-area img{display:block;max-width:100%}.cropper-view-box,.cropper-face{border-radius:50%}.cropper-line,.cropper-point{background-color:var(--accent)}.preview{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#eee;margin:12px auto;display:grid;place-items:center;font-size:11px}.preview img{width:100%;height:100%;object-fit:cover}.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.pick{border:1px solid var(--line);border-radius:15px;background:var(--soft);padding:8px 4px;text-align:center}.pick.sel{border-color:var(--accent);animation:pick-jelly .34s cubic-bezier(.2,1.5,.3,1)}@keyframes pick-jelly{0%{transform:scale(.88)}65%{transform:scale(1.07)}100%{transform:scale(1)}}.pick .miniava{width:50px;height:50px;margin:auto}.pick span{display:block;font-size:9px;font-weight:750;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.direction-box{padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--soft);margin:9px 0}.direction-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.direction-title{font-size:11px;font-weight:850;color:var(--ink)}.toggle-label{display:flex;flex-direction:row;align-items:center;gap:6px;margin:0;font-size:10px}.toggle-label input{width:auto;margin:0}.off-note{font-size:9px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.presets button{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:12px 6px;font-weight:750}.toast{position:fixed;left:50%;bottom:calc(78px + var(--safe));transform:translateX(-50%) translateY(12px);opacity:0;background:#25211d;color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;z-index:80;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(min-width:760px){.main{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;padding:12px}.stage-wrap{padding:0}.stage{height:calc(100dvh - 92px);max-height:none}.panel{padding:0}.bottom-nav{position:static;width:100%;margin-top:10px}.app{padding-bottom:16px}.view{display:none}.view.active{display:block}.toast{bottom:24px}dialog{max-width:620px;margin:auto}.sheet{border-radius:24px;padding-bottom:20px}}

<body>
<div id="toast" class="toast"></div><div class="app"><header class="topbar"><div class="brand">人物關係網</div><div class="top-actions"><button id="saveImage" class="icon-btn" title="儲存圖片">⇩</button></div></header><main class="main"><div class="stage-wrap"><section id="stage" class="stage"><div class="stage-head"><div><div id="stageTitle" class="stage-title">人物關係網</div><div class="stage-sub">拖動頭像調整位置・點一下切換角色</div></div><div class="tools"><button id="layoutReset" class="tool" title="重設排列">↺</button><button id="zout" class="tool">−</button><button id="reset" class="tool">◎</button><button id="zin" class="tool">＋</button></div></div><svg id="edges"></svg><div id="nodes" class="nodes"></div><div id="empty" class="empty hidden"><b>◎</b><h3>這個角色還沒有顯示中的關係</h3><p>可以新增關係，或把單向關係打開顯示。</p></div></section></div><section class="panel"><div id="view-network" class="view active"><div class="panel-title"><h2>目前關係網</h2></div><div class="quick-actions"><button id="addRel" class="primary">＋ 加既有角色</button><button id="quickAddChar" class="ghost">＋ 新角色</button></div><div id="currentCard"></div><div id="relList" class="rel-list"></div></div><div id="view-characters" class="view"><div class="panel-title"><div><h2>角色索引</h2><div class="small">搜尋角色，點一下直接查看或修改他的關係網。</div></div><button id="addChar" class="primary">＋ 角色</button></div><input id="charSearch" class="index-search" type="search" placeholder="搜尋角色名稱…"><div id="characterList" class="character-list"></div></div><div id="view-style" class="view"><div class="panel-title"><div><h2>外觀</h2><div class="small">簡單調背景就好。</div></div></div><div class="presets"><button data-bg="#f4f1eb" data-ink="#27231f">暖白</button><button data-bg="#edf3f8" data-ink="#203040">淡藍</button><button data-bg="#1f1f1d" data-ink="#f1eee8">深色</button></div><label>背景色<input id="bgColor" type="color"></label><label>背景圖片<input id="bgPhoto" type="file" accept="image/*"></label><button id="clearBg" class="ghost" style="width:100%">移除背景圖片</button></div></section></main><nav class="bottom-nav"><button class="navbtn active" data-view="network">關係網</button><button class="navbtn" data-view="characters">角色索引</button><button class="navbtn" data-view="style">外觀</button></nav></div>
<dialog id="charDlg"><div class="sheet"><div class="grab"></div><div class="mhead"><div><h3 id="charDlgTitle">新增角色</h3><p>名字和照片只要建立一次。</p></div><button class="close" onclick="charDlg.close()">×</button></div><label>角色名稱<input id="charName"></label><label>角色照片<input id="charPhoto" type="file" accept="image/*"></label><div id="cropArea" class="crop-area hidden"><img id="cropImage" alt="頭像裁切"></div><div id="preview" class="preview">預覽</div><div class="small" style="text-align:center;margin-top:-6px">拖動圖片調整位置，雙指或滾輪可縮放</div><label>代表色<input id="charColor" type="color" value="#7d7369"></label><button id="saveChar" class="primary" style="width:100%">儲存角色</button></div></dialog>
<dialog id="relDlg"><div class="sheet"><div class="grab"></div><div class="mhead"><div><h3>人物關係</h3><p>先選角色，再分別設定雙方看到的關係。</p></div><button class="close" onclick="relDlg.close()">×</button></div><div class="quick-actions" style="margin-top:10px"><button id="relAddNewChar" class="ghost" style="grid-column:1/-1">＋ 新角色</button></div><div id="pickGrid" class="pick-grid"></div><div id="relFields" class="hidden"><div class="direction-box"><div class="direction-top"><div id="fromTitle" class="direction-title"></div><label class="toggle-label"><input id="showFrom" type="checkbox" checked> 顯示</label></div><label>關係文字<input id="fromRel" placeholder="例如：偶像、摯友、同事……"></label><div id="fromOff" class="off-note hidden">關掉後，這一方的關係網不會出現對方。</div></div><div class="direction-box"><div class="direction-top"><div id="toTitle" class="direction-title"></div><label class="toggle-label"><input id="showTo" type="checkbox" checked> 顯示</label></div><label>關係文字<input id="toRel" placeholder="例如：不認識、普通朋友……"></label><div id="toOff" class="off-note hidden">關掉後，這一方的關係網不會出現對方。</div></div><div class="grid2"><label>線條顏色<input id="lineColor" type="color" value="#8a8178"></label><label>線條<select id="lineStyle"><option value="solid">實線</option><option value="dashed">虛線</option><option value="dotted">點線</option></select></label></div><button id="saveRel" class="primary" style="width:100%">儲存關係</button></div></div></dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const DB='character-map-simple-v2';const S={chars:[],rels:[],focus:null,editChar:null,editRel:null,pick:null,bg:'#f4f1eb',ink:'#27231f',bgImage:null,scale:1,x:0,y:0,createFromNetwork:false,charQuery:'',layouts:{},nodeDrag:null,pos:{},cropper:null};function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),1700)}function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function persist(){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('s','readwrite');t.objectStore('s').put({chars:S.chars,rels:S.rels,focus:S.focus,bg:S.bg,ink:S.ink,bgImage:S.bgImage,layouts:S.layouts},'main');t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function load(){let d=await db(),v=await new Promise((res,rej)=>{let t=d.transaction('s'),r=t.objectStore('s').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)Object.assign(S,v);S.layouts=S.layouts||{};S.rels=S.rels.map(r=>({...r,showA:r.showA!==false,showB:r.showB!==false}));render()}function photo(c){return c?.photo?`<img src="${c.photo}">`:esc((c?.name||'?').slice(0,2))}function cur(){return S.chars.find(c=>c.id===S.focus)}function relVisibleFrom(r,id){return r.a===id?r.showA!==false:r.b===id?r.showB!==false:false}function linksFor(id){return S.rels.filter(r=>(r.a===id||r.b===id)&&relVisibleFrom(r,id))}function other(r,id=S.focus){return r.a===id?r.b:r.a}function labelFrom(r,id=S.focus){return r.a===id?r.aLabel:r.bLabel}function triggerJelly(){let st=$('#stage');st.classList.remove('jelly');void st.offsetWidth;st.classList.add('jelly');setTimeout(()=>st.classList.remove('jelly'),580)}function switchFocus(id){if(!S.chars.some(c=>c.id===id)||id===S.focus)return;S.focus=id;S.x=0;S.y=0;S.scale=1;persist();render();triggerJelly();showView('network')}function render(){if(!S.focus||!S.chars.some(c=>c.id===S.focus))S.focus=S.chars[0]?.id||null;document.documentElement.style.setProperty('--bg',S.bg);document.documentElement.style.setProperty('--ink',S.ink);document.documentElement.style.setProperty('--accent',S.ink);$('#stage').style.setProperty('--bgimg',S.bgImage?`url("${S.bgImage}")`:'none');$('#bgColor').value=S.bg;renderCurrent();renderRelations();renderCharacters();renderGraph()}function renderCurrent(){let c=cur();$('#currentCard').innerHTML=c?`<div class="current-card"><div class="miniava" style="background:${c.color}">${photo(c)}</div><div><div class="current-name">${esc(c.name)}</div><div class="current-info">現在顯示 ${linksFor(c.id).length} 個角色</div></div></div>`:'<div class="small">先到「全部角色」新增角色。</div>'}function renderRelations(){let c=cur(),box=$('#relList');if(!c){box.innerHTML='';return}let ls=linksFor(c.id);box.innerHTML=ls.length?ls.map(r=>{let o=S.chars.find(x=>x.id===other(r,c.id));return `<div class="rel-row"><button class="relava switch-rel" data-id="${o.id}" style="background:${o.color}">${photo(o)}</button><div><div class="rname">${esc(o.name)}</div><div class="rdesc">${esc(labelFrom(r,c.id)||'未填關係')} · 對方：${r.a===c.id?(r.showB===false?'不顯示':esc(r.bLabel||'未填')):(r.showA===false?'不顯示':esc(r.aLabel||'未填'))}</div></div><button class="mini-act edit-rel" data-id="${r.id}">✎</button><button class="mini-act remove-rel" data-id="${r.id}">×</button></div>`}).join(''):'<div class="small" style="padding:10px 2px">目前沒有顯示中的關係。</div>';$$('.switch-rel').forEach(b=>b.onclick=()=>switchFocus(b.dataset.id));$$('.edit-rel').forEach(b=>b.onclick=()=>openRelation(b.dataset.id));$$('.remove-rel').forEach(b=>b.onclick=()=>removeCurrentSide(b.dataset.id))}function renderCharacters(){let box=$('#characterList'),q=(S.charQuery||'').trim().toLowerCase(),shown=q?S.chars.filter(c=>c.name.toLowerCase().includes(q)):S.chars;box.innerHTML=shown.length?shown.map(c=>`<div class="char-row ${c.id===S.focus?'active':''}" data-id="${c.id}"><div class="miniava" style="background:${c.color}">${photo(c)}</div><div><div class="char-name">${esc(c.name)}</div><div class="char-hint">查看／修改這個角色的關係網</div></div><button class="delete" data-del="${c.id}">×</button></div>`).join(''):`<div class="small">${S.chars.length?'找不到符合的角色。':'還沒有角色。'}</div>`;$$('.char-row').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-del]'))return;switchFocus(r.dataset.id)});$$('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteCharacter(b.dataset.del)})}function autoPositions(ids,w,h,cid){let cx=w/2,cy=h/2+18,rx=Math.min(w*.37,180),ry=Math.min(h*.28,135),p={[cid]:{x:cx,y:cy}};ids.forEach((id,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);p[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});return p}function layoutFor(focus){return S.layouts[focus]||(S.layouts[focus]={})}function buildPositions(ids,cid,w,h){let p=autoPositions(ids,w,h,cid),lay=layoutFor(cid);[cid,...ids].forEach(id=>{let q=lay[id];if(q)p[id]={x:q.x*w,y:q.y*h}});return p}function drawEdges(ls,cid){let out='';ls.forEach(r=>{let a=S.pos[cid],b=S.pos[other(r,cid)];if(!a||!b)return;let dash=r.style==='dashed'?'9 7':r.style==='dotted'?'2 6':'';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${r.color||'#8a8178'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${dash}"/>`;let lab=labelFrom(r,cid);if(lab)out+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-7}" text-anchor="middle" class="reltext" fill="${S.ink}" stroke="${S.bg}">${esc(lab)}</text>`});$('#edges').innerHTML=out}function renderGraph(){let nodes=$('#nodes'),emp=$('#empty'),c=cur();if(!c){nodes.innerHTML='';$('#edges').innerHTML='';emp.classList.remove('hidden');return}let ls=linksFor(c.id),ids=ls.map
