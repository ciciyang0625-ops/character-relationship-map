<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物關係網</title><style>:root{--bg:#f6f4ef;--ink:#24211e;--panel:#fff;--line:#ddd7ce;--accent:#2f2a26}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(10px)}.brand{font-weight:800}.actions{display:flex;gap:8px}.btn,.mini{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.editor{height:calc(100vh - 64px);display:grid;grid-template-columns:320px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:15px;overflow:auto}.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.sec:first-child{border-top:0;margin-top:0;padding-top:0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h2{font-size:15px;margin:0}.tiny{font-size:11px;color:#77716b}.stack{display:flex;flex-direction:column;gap:7px;margin-top:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:#faf9f7;border-radius:11px;padding:8px}.itxt{min-width:0}.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#77716b;margin-top:2px}.mini{padding:5px 7px;font-size:10px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#77716b;margin:10px 0}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}.stage{position:relative;overflow:hidden;background:var(--bg)}.stage:before{content:"";position:absolute;inset:0;background-image:var(--bgimg,none);background-size:cover;background-position:center;opacity:.22}.stageTop{position:absolute;z-index:5;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;pointer-events:none}.stageTop>*{pointer-events:auto}.title{font-weight:800;font-size:20px}.intro{font-size:12px;opacity:.65;margin-top:3px}.tools{display:flex;gap:5px}.tool{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.nodes{position:absolute;inset:0;transform-origin:0 0}.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:130px;cursor:pointer;transition:left .38s ease,top .38s ease}.ava{margin:auto;display:grid;place-items:center;overflow:hidden;border:4px solid rgba(255,255,255,.95);box-shadow:0 7px 22px rgba(0,0,0,.12);font-weight:800}.ava img{width:100%;height:100%;object-fit:cover}.nlabel{display:inline-block;margin-top:6px;padding:3px 7px;background:rgba(255,255,255,.82);border-radius:7px;font-size:12px;font-weight:700}.reltext{font-size:11px;font-weight:700;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}.empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;color:#77716b;text-align:center}.empty b{font-size:40px}.empty h3{margin:8px 0 2px}.empty p{margin:0;font-size:12px}dialog{border:0;background:transparent;padding:0}dialog::backdrop{background:rgba(20,17,14,.4);backdrop-filter:blur(3px)}.modal{width:min(560px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.mhead{display:flex;justify-content:space-between;align-items:flex-start}.mhead h3{margin:0}.close{border:0;background:transparent;font-size:22px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preset{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.preset button{border:1px solid var(--line);border-radius:10px;padding:10px;background:#faf9f7;cursor:pointer}.copy{display:flex;gap:6px}.notice{padding:10px;border-radius:10px;background:#f4f1eb;font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(15px);opacity:0;background:#26221e;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:850px){.editor{grid-template-columns:1fr;height:auto}.stage{height:68vh;min-height:520px}.side{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:560px){.grid2,.preset{grid-template-columns:1fr}}</style></head><body><div id="toast" class="toast"></div><header class="top"><div class="brand">人物關係網</div><div class="actions"><button id="notionBtn" class="btn hidden">Notion</button><button id="customBtn" class="btn hidden">客製化</button></div></header><main class="editor"><aside id="side" class="side"><section class="sec"><div class="head"><h2>中心角色</h2><span class="tiny">點右邊人物也能切換</span></div><select id="focus"></select></section><section class="sec editOnly"><div class="head"><h2>角色</h2><button id="addChar" class="mini">＋新增</button></div><div id="chars" class="stack"></div></section><section class="sec editOnly"><div class="head"><h2>關係</h2><button id="addRel" class="mini">＋新增</button></div><div class="tiny">雙方對彼此的認知可以不同。</div><div id="rels" class="stack"></div></section><section id="viewerHint" class="sec hidden"><div class="notice">目前是公開瀏覽模式。你可以點人物切換視角，但不能修改資料。</div></section></aside><section id="stage" class="stage"><div class="stageTop"><div><div id="stageTitle" class="title">人物關係網</div><div id="stageIntro" class="intro"></div></div><div class="tools"><button id="zout" class="tool">−</button><button id="reset" class="tool">◎</button><button id="zin" class="tool">＋</button></div></div><svg id="edges"></svg><div id="nodes" class="nodes"></div><div id="empty" class="empty hidden"><b>◎</b><h3>還沒有關係</h3><p>編輯模式下可以從左邊新增。</p></div></section></main><dialog id="charDlg"><div class="modal"><div class="mhead"><h3 id="charTitle">新增角色</h3><button class="close" onclick="charDlg.close()">×</button></div><label>角色名稱<input id="charName"></label><label>簡介<textarea id="charBio" rows="4"></textarea></label><label>代表色<input id="charColor" type="color" value="#7c6f64"></label><label>角色照片<input id="charPhoto" type="file" accept="image/*"></label><div class="notice">照片會自動裁成正方形並壓縮，避免太吃空間。</div><button id="saveChar" class="btn primary" style="width:100%;margin-top:12px">儲存角色</button></div></dialog><dialog id="relDlg"><div class="modal"><div class="mhead"><h3>人物關係</h3><button class="close" onclick="relDlg.close()">×</button></div><div class="grid2"><label>角色 1<select id="ra"></select></label><label>角色 2<select id="rb"></select></label></div><label><span id="aLabel">角色 1 認為角色 2 是……</span><input id="ab" placeholder="例如：摯友"></label><label><span id="bLabel">角色 2 認為角色 1 是……</span><input id="ba" placeholder="例如：普通朋友"></label><div class="grid2"><label>線條顏色<input id="rcolor" type="color" value="#8a8178"></label><label>線條<select id="rstyle"><option value="solid">實線</option><option value="dashed">虛線</option><option value="dotted">點線</option></select></label></div><button id="saveRel" class="btn primary" style="width:100%">儲存關係</button></div></dialog><dialog id="customDlg"><div class="modal"><div class="mhead"><h3>客製化</h3><button class="close" onclick="customDlg.close()">×</button></div><div class="preset"><button data-p="paper">紙張</button><button data-p="dark">深色</button><button data-p="blue">藍調</button></div><label>標題<input id="siteTitle"></label><label>介紹<textarea id="siteIntro" rows="3"></textarea></label><div class="grid2"><label>背景色<input id="bg" type="color"></label><label>文字色<input id="ink" type="color"></label></div><label>背景圖片網址<input id="bgimg" placeholder="可留空"></label><div class="grid2"><label>頭像形狀<select id="shape"><option value="round">圓形</option><option value="soft-square">圓角方形</option><option value="square">方形</option></select></label><label>頭像大小<input id="size" type="range" min="48" max="180" step="4"></label></div><button id="saveCustom" class="btn primary" style="width:100%">儲存外觀</button></div></dialog><dialog id="notionDlg"><div class="modal"><div class="mhead"><h3>放進 Notion</h3><button class="close" onclick="notionDlg.close()">×</button></div><div class="notice">1. 複製下面的公開網址。<br>2. 到 Notion 輸入 <b>/embed</b>。<br>3. 貼上網址並選「嵌入連結」。<br>4. 把嵌入區塊拉大，就能直接在 Notion 裡點角色。</div><label>公開網址<div class="copy"><input id="publicUrl" readonly><button id="copyUrl" class="btn">複製</button></div></label></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://iroaqyxzeauybncislvv.supabase.co',KEY='sb_publishable_2KNMow7zkY-wuvqUJdVCXw_iKnEgssq',FN=URL+'/functions/v1/edit-character-map',sb=window.supabase.createClient(URL,KEY),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const S={token:null,edit:false,site:null,chars:[],rels:[],focus:null,ec:null,er:null,view:{scale:1,x:0,y:0}};function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1900)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(action,payload={}){let r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({token:S.token,action,payload})}),j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'操作失敗');return j.data}async function init(){let q=new URLSearchParams(location.search),t=q.get('edit');if(t){localStorage.setItem('character_map_edit_token',t);S.token=t;history.replaceState({},'',location.pathname)}else S.token=localStorage.getItem('character_map_edit_token');S.edit=!!S.token;if(S.edit){try{let d=await api('get_all');S.site=d.site;S.chars=d.characters;S.rels=d.relationships}catch(e){localStorage.removeItem('character_map_edit_token');S.edit=false;toast('私人編輯連結已失效')}}if(!S.edit)await loadPublic();renderMode();render()}async function loadPublic(){let slug=new URLSearchParams(location.search).get('site')||'koma-relations',a=await sb.from('site_settings').select('*').eq('site_slug',slug).eq('is_public',true).maybeSingle();if(!a.data){document.body.innerHTML='<div style="padding:35px;font-family:system-ui">這個人物關係網目前沒有公開。</div>';return}S.site=a.data;let [c,r]=await Promise.all([sb.from('characters').select('*').eq('site_id',S.site.id),sb.from('relationships').select('*').eq('site_id',S.site.id)]);S.chars=c.data||[];S.rels=r.data||[]}function renderMode(){$$('.editOnly').forEach(e=>e.classList.toggle('hidden',!S.edit));$('#customBtn').classList.toggle('hidden',!S.edit);$('#notionBtn').classList.toggle('hidden',!S.edit);$('#viewerHint').classList.toggle('hidden',S.edit)}function render(){if(!S.focus||!S.chars.some(c=>c.id===S.focus))S.focus=S.chars[0]?.id||null;applyStyle();renderFocus();renderChars();renderRels();graph()}function applyStyle(){let s=S.site||{};document.documentElement.style.setProperty('--bg',s.background_color||'#f6f4ef');document.documentElement.style.setProperty('--ink',s.text_color||'#24211e');document.documentElement.style.setProperty('--accent',s.accent_color||'#2f2a26');$('#stage').style.setProperty('--bgimg',s.background_image_url?`url("${s.background_image_url}")`:'none');$('#stageTitle').textContent=s.site_title||'人物關係網';$('#stageIntro').textContent=s.intro_text||'';if(S.edit){$('#siteTitle').value=s.site_title||'';$('#siteIntro').value=s.intro_text||'';$('#bg').value=s.background_color||'#f6f4ef';$('#ink').value=s.text_color||'#24211e';$('#bgimg').value=s.background_image_url||'';$('#shape').value=s.node_shape||'round';$('#size').value=s.node_size||88;$('#publicUrl').value=location.origin+location.pathname+'?site='+encodeURIComponent(s.site_slug)}}function renderFocus(){$('#focus').innerHTML=S.chars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if(S.focus)$('#focus').value=S.focus}function renderChars(){if(!S.edit)return;$('#chars').innerHTML=S.chars.length?S.chars.map(c=>`<div class="item"><div class="itxt"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.bio||'尚無簡介')}</div></div><div><button class="mini ec" data-id="${c.id}">編輯</button> <button class="mini dc" data-id="${c.id}">刪除</button></div></div>`).join(''):'<div class="tiny">還沒有角色。</div>';$$('.ec').forEach(b=>b.onclick=()=>openChar(b.dataset.id));$$('.dc').forEach(b=>b.onclick=()=>delChar(b.dataset.id))}function nm(id){return S.chars.find(c=>c.id===id)?.name||'?'}function renderRels(){if(!S.edit)return;$('#rels').innerHTML=S.rels.length?S.rels.map(r=>`<div class="item"><div class="itxt"><div class="name"><span style="color:${r.color}">●</span> ${esc(nm(r.character_a_id))} ↔ ${esc(nm(r.character_b_id))}</div><div class="sub">${esc(r.a_to_b_label||'未設定')} / ${esc(r.b_to_a_label||'未設定')}</div></div><div><button class="mini er" data-id="${r.id}">編輯</button> <button class="mini dr" data-id="${r.id}">刪除</button></div></div>`).join(''):'<div class="tiny">還沒有關係。</div>';$$('.er').forEach(b=>b.onclick=()=>openRel(b.dataset.id));$$('.dr').forEach(b=>b.onclick=()=>delRel(b.dataset.id))}function links(){return S.rels.filter(r=>r.character_a_id===S.focus||r.character_b_id===S.focus)}function other(r){return r.character_a_id===S.focus?r.character_b_id:r.character_a_id}function relLabel(r){return r.character_a_id===S.focus?r.a_to_b_label:r.b_to_a_label}function graph(){let nodes=$('#nodes'),svg=$('#edges'),emp=$('#empty');if(!S.chars.length){nodes.innerHTML='';svg.innerHTML='';emp.classList.remove('hidden');return}let f=S.chars.find(c=>c.id===S.focus)||S.chars[0];S.focus=f.id;let ls=links(),ids=[];ls.forEach(r=>{let i=other(r);if(!ids.includes(i))ids.push(i)});emp.classList.toggle('hidden',ids.length>0);let rc=$('#stage').getBoundingClientRect(),cx=rc.width/2,cy=rc.height/2+28,rx=Math.min(rc.width*.34,350),ry=Math.min(rc.height*.3,250),pos={[f.id]:{x:cx,y:cy}};ids.forEach((id,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);pos[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});nodes.style.transform=`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;svg.style.transform=`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.scale})`;svg.style.transformOrigin='0 0';let size=S.site?.node_size||88,shape=S.site?.node_shape||'round',rad=shape==='round'?'50%':shape==='soft-square'?'24%':'8px';nodes.innerHTML=[f.id,...ids].map(id=>{let c=S.chars.find(x=>x.id===id),p=pos[id],sz=id===f.id?size*1.2:size;return `<div class="node" data-id="${id}" style="left:${p.x}px;top:${p.y}px"><div class="ava" style="width:${sz}px;height:${sz}px;border-radius:${rad};background:${c.accent_color}">${c.avatar_url?`<img src="${c.avatar_url}">`:esc(c.name.slice(0,2))}</div><span class="nlabel">${esc(c.name)}</span></div>`}).join('');nodes.querySelectorAll('.node').forEach(n=>n.onclick=()=>{if(n.dataset.id!==S.focus){S.focus=n.dataset.id;$('#focus').value=S.focus;graph()}});let out='';ls.forEach(r=>{let a=pos[f.id],b=pos[other(r)],dash=r.line_style==='dashed'?'10 8':r.line_style==='dotted'?'2 7':'';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${r.color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let lab=relLabel(r);if(lab)out+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-8}" text-anchor="middle" class="reltext" fill="${S.site.text_color}" stroke="${S.site.background_color}">${esc(lab)}</text>`});svg.innerHTML=out}function openChar(id=null){S.ec=id;let c=S.chars.find(x=>x.id===id);$('#charTitle').textContent=c?'編輯角色':'新增角色';$('#charName').value=c?.name||'';$('#charBio').value=c?.bio||'';$('#charColor').value=c?.accent_color||'#7c6f64';$('#charPhoto').value='';charDlg.showModal()}async function imageData(){let f=$('#charPhoto').files[0];if(!f)return S.chars.find(c=>c.id===S.ec)?.avatar_url||null;let img=await new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)}),n=Math.min(img.width,img.height),sx=(img.width-n)/2,sy=(img.height-n)/2,c=document.createElement('canvas');c.width=c.height=420;c.getContext('2d').drawImage(img,sx,sy,n,n,0,0,420,420);return c.toDataURL('image/jpeg',.78)}async function saveChar(){let name=$('#charName').value.trim();if(!name)return toast('請輸入角色名稱');let p={name,bio:$('#charBio').value.trim(),accent_color:$('#charColor').value,avatar_url:await imageData()};try{await api(S.ec?'update_character':'create_character',S.ec?{id:S.ec,...p}:p);charDlg.close();await reload();toast('角色已儲存')}catch(e){toast(e.message)}}async function delChar(id){if(!confirm('確定刪除這個角色？'))return;try{await api('delete_character',{id});await reload()}catch(e){toast(e.message)}}function fillRel(){let o=S.chars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#ra').innerHTML=$('#rb').innerHTML=o}function relTexts(){let a=nm($('#ra').value),b=nm($('#rb').value);$('#aLabel').textContent=`${a} 認為 ${b} 是……`;$('#bLabel').textContent=`${b} 認為 ${a} 是……`}function openRel(id=null){if(S.chars.length<2)return toast('至少需要兩個角色');S.er=id;fillRel();let r=S.rels.find(x=>x.id===id);if(r){$('#ra').value=r.character_a_id;$('#rb').value=r.character_b_id;$('#ab').value=r.a_to_b_label;$('#ba').value=r.b_to_a_label;$('#rcolor').value=r.color;$('#rstyle').value=r.line_style}else{$('#rb').selectedIndex=1;$('#ab').value=$('#ba').value='';$('#rcolor').value='#8a8178';$('#rstyle').value='solid'}relTexts();relDlg.showModal()}async function saveRel(){let a=$('#ra').value,b=$('#rb').value;if(a===b)return toast('請選兩個不同角色');let p={character_a_id:a,character_b_id:b,a_to_b_label:$('#ab').value.trim(),b_to_a_label:$('#ba').value.trim(),color:$('#rcolor').value,line_style:$('#rstyle').value};try{await api(S.er?'update_relationship':'create_relationship',S.er?{id:S.er,...p}:p);relDlg.close();await reload();toast('關係已儲存')}catch(e){toast(e.message)}}async function delRel(id){if(!confirm('確定刪除這筆關係？'))return;try{await api('delete_relationship',{id});await reload()}catch(e){toast(e.message)}}async function reload(){let d=await api('get_all');S.site=d.site;S.chars=d.characters;S.rels=d.relationships;render()}async function saveSettings(p){try{S.site=await api('update_settings',p);render();toast('已儲存')}catch(e){toast(e.message)}}$('#addChar').onclick=()=>openChar();$('#saveChar').onclick=saveChar;$('#addRel').onclick=()=>openRel();$('#saveRel').onclick=saveRel;$('#ra').onchange=relTexts;$('#rb').onchange=relTexts;$('#focus').onchange=e=>{S.focus=e.target.value;graph()};$('#customBtn').onclick=()=>customDlg.showModal();$('#notionBtn').onclick=()=>notionDlg.showModal();$('#saveCustom').onclick=()=>saveSettings({site_title:$('#siteTitle').value.trim()||'人物關係網',intro_text:$('#siteIntro').value.trim(),background_color:$('#bg').value,text_color:$('#ink').value,background_image_url:$('#bgimg').value.trim()||null,node_shape:$('#shape').value,node_size:+$('#size').value});$$('.preset button').forEach(b=>b.onclick=()=>{let p=b.dataset.p==='dark'?{background_color:'#181817',text_color:'#f1eee8',accent_color:'#f1eee8',style_preset:'dark'}:b.dataset.p==='blue'?{background_color:'#edf3f8',text_color:'#203040',accent_color:'#466b8b',style_preset:'blue'}:{background_color:'#f6f4ef',text_color:'#24211e',accent_color:'#2f2a26',style_preset:'paper'};saveSettings(p)});$('#copyUrl').onclick=async()=>{await navigator.clipboard.writeText($('#publicUrl').value);toast('已複製')};function zoom(d){S.view.scale=Math.max(.55,Math.min(1.8,S.view.scale+d));graph()}$('#zin').onclick=()=>zoom(.1);$('#zout').onclick=()=>zoom(-.1);$('#reset').onclick=()=>{S.view={scale:1,x:0,y:0};graph()};let drag=false,sx,sy,ox,oy;$('#stage').onpointerdown=e=>{if(e.target.closest('.node')||e.target.closest('.tools'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=S.view.x;oy=S.view.y;$('#stage').setPointerCapture(e.pointerId)};$('#stage').onpointermove=e=>{if(!drag)return;S.view.x=ox+e.clientX-sx;S.view.y=oy+e.clientY-sy;graph()};$('#stage').onpointerup=()=>drag=false;$('#stage').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.08:-.08)},{passive:false});window.onresize=graph;init();</script></body></html>
