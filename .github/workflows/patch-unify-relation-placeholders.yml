name: Unify relation input placeholders
on:
  push:
    paths:
      - '.github/workflows/patch-unify-relation-placeholders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('placeholder="例如：偶像、摯友、同事……"', 'placeholder="例如：摯友、偶像、同事、不認識……"')
          s = s.replace('placeholder="例如：不認識、普通朋友……"', 'placeholder="例如：摯友、偶像、同事、不認識……"')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify relationship input placeholder text"
          git push
