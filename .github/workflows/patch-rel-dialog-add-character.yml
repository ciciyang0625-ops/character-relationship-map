name: Patch relationship dialog add character
on:
  push:
    paths:
      - '.github/workflows/patch-rel-dialog-add-character.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div id="pickGrid" class="pick-grid"></div>'
          new = '<div class="quick-actions" style="margin-top:10px"><button id="relAddNewChar" class="ghost" style="grid-column:1/-1">＋ 新角色</button></div><div id="pickGrid" class="pick-grid"></div>'
          if old not in s:
              raise SystemExit('pickGrid target not found')
          s = s.replace(old, new, 1)
          old2 = "$('#addChar').onclick=()=>openCharacter(false);$('#quickAddChar').onclick=()=>openCharacter(true);"
          new2 = "$('#addChar').onclick=()=>openCharacter(false);$('#quickAddChar').onclick=()=>openCharacter(true);$('#relAddNewChar').onclick=()=>{relDlg.close();openCharacter(true)};"
          if old2 not in s:
              raise SystemExit('handler target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add new character button inside relationship editor" || exit 0
          git push
