name: Patch clamp saved graph layout
on:
  push:
    paths:
      - '.github/workflows/patch-clamp-saved-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clamp saved positions into safe graph area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function buildPositions(ids,cid,w,h){let p=autoPositions(ids,w,h,cid),lay=layoutFor(cid);ids.forEach(id=>{let q=lay[id];if(q)p[id]={x:q.x*w,y:q.y*h}});return p}"
          new="function clampGraphPoint(x,y,w,h){let c=graphCenter(w,h),gr=graphRadius(w,h,c),vx=x-c.x,vy=y-c.y;if(Math.abs(vx)<.001&&Math.abs(vy)<.001){vx=gr.rx*.68;vy=0}let q=Math.sqrt((vx*vx)/(gr.rx*gr.rx)+(vy*vy)/(gr.ry*gr.ry)),target=Math.max(.68,Math.min(1,q||.68)),k=target/(q||1);return{x:c.x+vx*k,y:c.y+vy*k}}function buildPositions(ids,cid,w,h){let p=autoPositions(ids,w,h,cid),lay=layoutFor(cid);ids.forEach(id=>{let q=lay[id];if(q)p[id]=clampGraphPoint(q.x*w,q.y*h,w,h)});return p}"
          if old not in s:
              raise SystemExit('buildPositions pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clamp saved secondary character positions to safe area'
          git push
