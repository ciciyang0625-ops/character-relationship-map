name: Patch graph spacing and center lock
on:
  push:
    paths:
      - '.github/workflows/patch-spacing-center-lock.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (".stage{position:relative;height:min(44dvh,440px);min-height:300px;", ".stage{position:relative;height:min(52dvh,520px);min-height:370px;"),
            (".node.center .nava{width:86px;height:86px}", ".node.center{cursor:default;touch-action:auto}.node.center .nava{width:86px;height:86px}"),
            (".reltext{font-size:10px;font-weight:800;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}", ".reltext{font-size:11px;font-weight:850;paint-order:stroke;stroke-width:2px;stroke-linejoin:round}"),
            ("拖動頭像調整位置・點一下切換角色", "拖動副角色調整位置・中心角色固定"),
            ("<label>代表色<input id=\"charColor\" type=\"color\" value=\"#7d7369\"></label>", ""),
            ("$('#charColor').value='#7d7369';", ""),
            ("let c={id:uid(),name,photo:ph,color:$('#charColor').value};", "let c={id:uid(),name,photo:ph};"),
            ("style=\"background:${c.color}\"", ""),
            ("style=\"background:${o.color}\"", ""),
            ("style=\"background:${ch.color}\"", ""),
            ("ctx.fillStyle=ch.color||'#aaa';", "ctx.fillStyle='#d8d4ce';"),
          ]
          for old, new in replacements:
            if old not in s:
              print('warning: pattern not found:', old[:80])
            s = s.replace(old, new)

          old = "function autoPositions(ids,w,h,cid){let cx=w/2,cy=h/2+18,rx=Math.min(w*.37,180),ry=Math.min(h*.28,135),p={[cid]:{x:cx,y:cy}};ids.forEach((id,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);p[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});return p}"
          new = "function autoPositions(ids,w,h,cid){let cx=w/2,cy=h/2+20,rx=Math.min(w*.41,205),ry=Math.min(h*.35,185),p={[cid]:{x:cx,y:cy}};ids.forEach((id,i)=>{let a=-Math.PI/2+i*Math.PI*2/Math.max(ids.length,1);p[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});return p}"
          if old not in s: raise SystemExit('autoPositions pattern missing')
          s = s.replace(old, new)

          old = "function buildPositions(ids,cid,w,h){let p=autoPositions(ids,w,h,cid),lay=layoutFor(cid);[cid,...ids].forEach(id=>{let q=lay[id];if(q)p[id]={x:q.x*w,y:q.y*h}});return p}"
          new = "function buildPositions(ids,cid,w,h){let p=autoPositions(ids,w,h,cid),lay=layoutFor(cid);ids.forEach(id=>{let q=lay[id];if(q)p[id]={x:q.x*w,y:q.y*h}});return p}"
          if old not in s: raise SystemExit('buildPositions pattern missing')
          s = s.replace(old, new)

          start = s.index("function drawEdges(ls,cid){")
          end = s.index("function renderGraph(){", start)
          s = s[:start] + '''function drawEdges(ls,cid){let out='';ls.forEach(r=>{let a=S.pos[cid],b=S.pos[other(r,cid)];if(!a||!b)return;let dash=r.style==='dashed'?'9 7':r.style==='dotted'?'2 6':'';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${r.color||'#8a8178'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${dash}"/>`;let lab=labelFrom(r,cid);if(lab){let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,mx=(a.x+b.x)/2-dy/len*13,my=(a.y+b.y)/2+dx/len*13,bw=Math.max(42,[...lab].length*12+18);out+=`<g><rect x="${mx-bw/2}" y="${my-12}" width="${bw}" height="24" rx="12" fill="${S.bg}" fill-opacity=".94"/><text x="${mx}" y="${my+4}" text-anchor="middle" class="reltext" fill="${S.ink}">${esc(lab)}</text></g>`}});$('#edges').innerHTML=out}''' + s[end:]

          old = "nodes.querySelectorAll('.node').forEach(n=>n.addEventListener('pointerdown',startNodeDrag));"
          new = "nodes.querySelectorAll('.node:not(.center)').forEach(n=>n.addEventListener('pointerdown',startNodeDrag));"
          if old not in s: raise SystemExit('node listener pattern missing')
          s = s.replace(old, new)

          old = "let rc=$('#stage').getBoundingClientRect(),x=Math.max(46,Math.min(rc.width-46,d.x+dx)),y=Math.max(78,Math.min(rc.height-44,d.y+dy));"
          new = "let rc=$('#stage').getBoundingClientRect(),x=Math.max(48,Math.min(rc.width-48,d.x+dx)),y=Math.max(88,Math.min(rc.height-54,d.y+dy));"
          if old in s: s = s.replace(old, new)

          old = "rx=ids.length<=4?340:390,ry=ids.length<=4?300:355"
          new = "rx=ids.length<=4?390:430,ry=ids.length<=4?350:400"
          if old not in s: raise SystemExit('export radius pattern missing')
          s = s.replace(old, new)

          old = "[c.id,...ids].forEach(id=>{let q=lay[id];if(q)pos[id]={x:Math.max(90,Math.min(1110,q.x*size)),y:Math.max(120,Math.min(1050,q.y*size))}});"
          new = "ids.forEach(id=>{let q=lay[id];if(q)pos[id]={x:Math.max(90,Math.min(1110,q.x*size)),y:Math.max(120,Math.min(1050,q.y*size))}});"
          if old not in s: raise SystemExit('export center layout pattern missing')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve relationship graph readability and center lock" || exit 0
          git push